name: TokenFlow
options:
  bundleIdPrefix: com.adriendonot
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    MACOSX_DEPLOYMENT_TARGET: 15.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    DEVELOPMENT_TEAM: MKAFV9VL9V
    ENABLE_DEBUG_DYLIB: NO
targets:
  TokenFlow:
    type: application
    platform: macOS
    sources:
      - path: TokenFlowApp
      - path: TokenFlowShared
    entitlements:
      path: TokenFlowApp/TokenFlow.entitlements
      properties:
        com.apple.security.application-groups:
          - MKAFV9VL9V.com.adriendonot.tokenflow
    dependencies:
      - target: TokenFlowWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adriendonot.TokenFlow
        PRODUCT_NAME: TokenFlow
        INFOPLIST_FILE: TokenFlowApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  TokenFlowWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: TokenFlowWidgets
      - path: TokenFlowShared
    entitlements:
      path: TokenFlowWidgets/TokenFlowWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - MKAFV9VL9V.com.adriendonot.tokenflow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adriendonot.TokenFlow.widgets
        PRODUCT_NAME: TokenFlowWidgets
        INFOPLIST_FILE: TokenFlowWidgets/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
