name: TokenFlow
options:
  bundleIdPrefix: com.adriendonot
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    MACOSX_DEPLOYMENT_TARGET: 15.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    DEVELOPMENT_TEAM: MKAFV9VL9V
    ENABLE_DEBUG_DYLIB: NO
targets:
  TokenFlow:
    type: application
    platform: macOS
    sources:
      - path: TokenFlowApp
        excludes:
          - AppIcon.icon
      - path: TokenFlowShared
    entitlements:
      path: TokenFlowApp/TokenFlow.entitlements
      properties:
        com.apple.security.application-groups:
          - MKAFV9VL9V.com.adriendonot.tokenflow
    dependencies:
      - target: TokenFlowWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adriendonot.TokenFlow
        PRODUCT_NAME: TokenFlow
        INFOPLIST_FILE: TokenFlowApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      - name: Compile Icon Composer app icon
        shell: /bin/zsh
        script: |
          set -euo pipefail

          icon_dir="$SRCROOT/TokenFlowApp/AppIcon.icon"
          output_dir="$TARGET_TEMP_DIR/TokenFlowAppIcon"
          resources_dir="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          minimum_target="${MACOSX_DEPLOYMENT_TARGET:-15.0}"

          rm -rf "$output_dir"
          mkdir -p "$output_dir"

          xcrun actool "$icon_dir" \
            --compile "$output_dir" \
            --app-icon AppIcon \
            --enable-on-demand-resources NO \
            --development-region en \
            --target-device mac \
            --platform macosx \
            --include-all-app-icons \
            --minimum-deployment-target "$minimum_target" \
            --output-partial-info-plist "$output_dir/AppIcon-PartialInfo.plist"

          /usr/bin/ditto "$output_dir/Assets.car" "$resources_dir/Assets.car"
          /usr/bin/ditto "$output_dir/AppIcon.icns" "$resources_dir/AppIcon.icns"
          /usr/bin/touch "$output_dir/icon-composer.stamp"
        inputFiles:
          - $(SRCROOT)/TokenFlowApp/AppIcon.icon/icon.json
          - $(SRCROOT)/TokenFlowApp/AppIcon.icon/Assets/TokenFlow.png
        outputFiles:
          - $(TARGET_TEMP_DIR)/TokenFlowAppIcon/icon-composer.stamp
        basedOnDependencyAnalysis: false
        showEnvVars: false
  TokenFlowWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: TokenFlowWidgets
      - path: TokenFlowShared
    entitlements:
      path: TokenFlowWidgets/TokenFlowWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - MKAFV9VL9V.com.adriendonot.tokenflow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adriendonot.TokenFlow.widgets
        PRODUCT_NAME: TokenFlowWidgets
        INFOPLIST_FILE: TokenFlowWidgets/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
